<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430">
  <title>From a clinical question to an educational lesion-segmentation model</title>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#475569"/></marker></defs>
  <rect width="1280" height="430" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="640" y="42" font-size="28" fill="#0f172a">Our case: learning to outline a lesion in breast ultrasound</text>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <rect x="25" y="90" width="210" height="100" rx="14"/>
      <rect x="280" y="90" width="210" height="100" rx="14"/>
      <rect x="535" y="90" width="210" height="100" rx="14"/>
      <rect x="790" y="90" width="210" height="100" rx="14"/>
      <rect x="1045" y="90" width="210" height="100" rx="14"/>
    </g>
    <g font-size="22" fill="#0f172a">
      <text x="130" y="128">Image + mask</text><text x="130" y="158">examples</text>
      <text x="385" y="128">Split data</text><text x="385" y="158">train / valid / test</text>
      <text x="640" y="128">Train U-Net</text><text x="640" y="158">adjust weights</text>
      <text x="895" y="128">Validate + select</text><text x="895" y="158">then test</text>
      <text x="1150" y="128">New image</text><text x="1150" y="158">predicted outline</text>
    </g>
    <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
      <path d="M235 140 H272"/><path d="M490 140 H527"/><path d="M745 140 H782"/><path d="M1000 140 H1037"/>
    </g>
    <rect x="165" y="245" width="950" height="115" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="640" y="280" font-size="24" fill="#9a3412">Educational task: WHERE is the lesion?</text>
    <text x="640" y="315" font-size="21" fill="#9a3412">Not: Is this patient cancer-free? Not: Is the lesion malignant?</text>
    <text x="640" y="345" font-size="19" fill="#9a3412">Clinical screening needs additional evidence, safeguards, and professional review.</text>
    <text x="640" y="405" font-size="18" fill="#475569">A segmentation output is one possible input to a larger clinical workflow, not a diagnosis.</text>
  </g>
</svg>
