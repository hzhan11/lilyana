<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <title>Default image-level train, validation, and test split</title>
  <rect width="1280" height="440" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="640" y="45" font-size="29" fill="#0f172a">629 paired examples: each image stays with its reference mask</text>
    <text x="640" y="82" font-size="21" fill="#475569">420 benign images + 209 malignant images; no normal-class images in this subset</text>
    <rect x="50" y="120" width="827" height="115" fill="#bfdbfe"/>
    <rect x="877" y="120" width="176" height="115" fill="#bbf7d0"/>
    <rect x="1053" y="120" width="176" height="115" fill="#fed7aa"/>
    <g font-size="25" fill="#0f172a">
      <text x="463" y="163">TRAIN: 441</text><text x="463" y="201">Learn weights</text>
      <text x="965" y="161">VALID: 94</text><text x="965" y="198">Select model</text>
      <text x="1141" y="161">TEST: 94</text><text x="1141" y="198">Final check</text>
    </g>
    <g font-size="20" fill="#334155">
      <text x="463" y="280">294 benign + 147 malignant</text>
      <text x="965" y="280">63 + 31</text><text x="1141" y="280">63 + 31</text>
      <text x="640" y="329">Practice questions / mock exam / final exam</text>
    </g>
    <rect x="95" y="355" width="1090" height="55" rx="12" fill="#fee2e2"/>
    <text x="640" y="389" font-size="21" fill="#991b1b">Actual code splits by IMAGE. A clinical study should keep each PATIENT in only one split.</text>
  </g>
</svg>
