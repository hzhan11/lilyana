<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480">
  <title>Official BreastMNIST64 splits and remapped binary class counts</title>
  <rect width="1280" height="480" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="640" y="45" font-size="29" fill="#0f172a">780 images: preserve the official 70% / 10% / 20% split</text>
    <rect x="50" y="115" width="826" height="110" fill="#bfdbfe"/>
    <rect x="876" y="115" width="118" height="110" fill="#bbf7d0"/>
    <rect x="994" y="115" width="236" height="110" fill="#fed7aa"/>
    <g fill="#0f172a">
      <text x="463" y="156" font-size="26">TRAIN: 546</text><text x="463" y="195" font-size="23">Practice and update weights</text>
      <text x="935" y="157" font-size="21">VALID</text><text x="935" y="195" font-size="24">78</text>
      <text x="1112" y="156" font-size="26">TEST: 156</text><text x="1112" y="195" font-size="23">Final check</text>
    </g>
    <g font-size="22" fill="#334155">
      <text x="320" y="285">Training: 399 normal/benign + 147 malignant</text>
      <text x="920" y="285">Validation: 57 + 21</text>
      <text x="640" y="325">Test: 114 normal/benign + 42 malignant</text>
    </g>
    <rect x="90" y="365" width="1100" height="78" rx="12" fill="#fee2e2"/>
    <text x="640" y="396" font-size="22" fill="#991b1b">Do not reshuffle these splits. Do not train on test images.</text>
    <text x="640" y="426" font-size="19" fill="#991b1b">Patient-level independence is not established by this package.</text>
  </g>
</svg>
